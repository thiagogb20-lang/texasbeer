<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15123a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Texas Beer">
<title>Texas Beer</title>
<style>
:root{--bg:#15123a;--panel:#211d5a;--line:#3a3690;--amber:#f5a623;--red:#e3262e;--ok:#12a566;--ink:#ffffff;--mute:#a9a8d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;font-size:16px}
#app{max-width:720px;margin:0 auto;padding:16px;position:relative;z-index:1}
#wm{position:fixed;inset:0;background-position:center;background-repeat:no-repeat;background-size:min(78vw,520px);opacity:.07;pointer-events:none;z-index:0}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.5px}
h2{font-size:20px;margin:18px 0 8px}
.mute{color:var(--mute);font-size:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
button,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;cursor:pointer;min-height:48px}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
button.main{background:var(--amber);color:#1a1230;border-color:var(--amber);font-weight:700}
button.danger{background:var(--red);border-color:var(--red);color:#fff}
button.ghost{background:none}
button.sm{min-height:36px;padding:6px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
input{width:100%;background:#0e0c2b;border:1px solid var(--line);border-radius:10px;padding:12px;min-height:48px}
select{width:100%;background:#0e0c2b;border:1px solid var(--line);border-radius:10px;padding:12px;min-height:48px;color:var(--ink);font:inherit}
.ctl{display:flex;gap:6px;align-items:center}.ctl input{width:64px;text-align:center;padding:6px;min-height:36px}
button:disabled{opacity:.4;cursor:not-allowed}
.menu>*{min-width:44%}
.sw{width:56px;min-width:56px;height:32px;min-height:32px;padding:0;border-radius:99px;position:relative;background:#0e0c2b}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--mute);transition:left .15s}
.sw.on{background:var(--ok);border-color:var(--ok)}.sw.on i{left:27px;background:#fff}
@media(prefers-reduced-motion:reduce){.sw i{transition:none}}
label{display:block;margin:10px 0 4px;font-size:14px;color:var(--mute)}
.chk{display:flex;align-items:center;gap:10px;margin:14px 0}.chk input{width:22px;height:22px;min-height:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.mesa{min-height:72px;font-weight:700;font-size:17px;border-radius:12px}
.mesa small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.mesa.busy{border-color:var(--amber)}
.mesa.alert{animation:blink 1s steps(2,start) infinite;border-color:var(--red)}
@keyframes blink{50%{background:var(--red);color:#fff}}
@media(prefers-reduced-motion:reduce){.mesa.alert{animation:none;background:var(--red);color:#fff}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.tag{font-size:12px;background:var(--red);color:#fff;border-radius:6px;padding:2px 6px;margin-left:6px}
.total{display:flex;justify-content:space-between;font-size:22px;font-weight:800;margin:12px 0}
.prod{text-align:left;min-height:76px}
.prod.off{opacity:.3;pointer-events:none}
.logo{display:block;width:min(260px,70vw);height:auto;margin:0 auto 12px}
.err{color:var(--red);min-height:20px;margin:8px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal>div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:460px;width:100%;max-height:90vh;overflow:auto}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;border:1px solid var(--line)}
.pill.on{background:var(--ok);color:#ffffff;border-color:var(--ok)}
.qty{width:84px}
.cn{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mn{display:block;font-weight:400;font-size:13px;color:var(--mute)}
.det{display:none}
@media(min-width:900px){
 #app{max-width:1200px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
 .mesa{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:96px;gap:2px}
 .mesa small{display:inline}
 .det{display:flex;flex-direction:column;width:100%;margin-top:6px;font-weight:400;font-size:13px;gap:2px;max-height:170px;overflow:auto}
 .dl{display:flex;justify-content:space-between;gap:8px}
 .dl.tot{border-top:1px solid var(--line);padding-top:3px;margin-top:3px;font-weight:700}
 .by{color:var(--mute);font-size:11px;margin-top:-2px}
}
</style>
</head>

function load(){let d=null;try{d=JSON.parse(st.get(KEY))}catch(e){}

  d.tables=d.tables||{};d.sales=d.sales||[];d.closed=d.closed||{};
  Object.values(d.tables).forEach(t=>t.items.forEach(i=>{if(!i.id)i.id=uid()}));
  if(!d.balcao){const o=d.master;const dflt=!o||(o.u==='bar'&&o.p==='bar');d.balcao=[{id:'b1',name:dflt?'balcao':o.u,pass:dflt?'balcao':o.p,perms:allPerms(true)}];d.master={u:'master',p:'master'}}

  d.license=d.license||{start:null,until:null,per:null};[d.master,...d.balcao,...(d.staff||[])].forEach(o=>{delete o.until});
  d.staff=d.staff||[{id:'g1',name:'mesa',pass:'mesa'}];
  d.balcao.forEach(b=>{if(b.name==='bar'&&b.pass==='bar'){b.name='balcao';b.pass='balcao'}});
  d.staff.forEach(s=>{if(s.name==='Garson'&&s.pass==='garson'){s.name='mesa';s.pass='mesa'}});

  d.working=d.working||[];d.lastWorking=d.lastWorking||[];
  return d}

/* ---------- bar open/close ---------- */
function buildReport(sid){
  const sales=S.sales.filter(x=>x.sid===sid),pm={},pr={};let total=0;
  sales.forEach(s=>{total+=s.total;s.payments.forEach(p=>pm[p.m]=(pm[p.m]||0)+p.v);
    s.items.forEach(i=>{const r=pr[i.name]||(pr[i.name]={q:0,v:0,c:0});r.q+=i.qty;r.v+=i.qty*i.price;r.c+=i.qty*costOf(i)})});
  return{total,pm,pr,count:sales.length,date:new Date(sid).toLocaleDateString('pt-BR')}
}
function closeBar(auto){
  if(!S.open)return;
  S.pendingReport={...buildReport(S.sid),auto:!!auto};
  const d=new Date(S.sid);d.setHours(23,59,0,0);S.closedAt=auto?Math.max(S.sid,+d):Date.now();
  S.open=false;S.working=[];save()
}
function autoCheck(){
  if(!S.open)return;const d=new Date(),o=new Date(S.sid);
  if(d.toDateString()!==o.toDateString()||(d.getHours()===23&&d.getMinutes()>=59)){closeBar(true);render()}
}

function range(){const D=864e5,t=new Date();t.setHours(0,0,0,0);const a=+t;

  editprod(d){const p=S.products.find(x=>x.id===d.id);if(!p)return;const id=p.id;

  qno(){Q=null},

  dplus(d){const i=DR()[+d.x];if(!i)return;const p=S.products.find(x=>x.id===i.pid);if(p&&i.qty<p.qty)i.qty++;saveDraft();ui.err=''},

  send(){const tn=ui.table,dr=DR(),who0=wname();if(!dr.length)return;
    if(!S.open){ui.err='O bar está fechado.';return}
    for(const it of dr){const p=S.products.find(x=>x.id===it.pid);

  confirm(){tbl(ui.table).items.forEach(i=>i.ok=true);save()},
  delitem(d){const tn=ui.table,t=tbl(tn),i=t.items[+d.x];if(!i)return;const id=i.id;

  addstock(){const ex=S.products.find(x=>x.id===PICK);if(!ex){ui.err='Escolha a categoria, a subcategoria e o produto.';return render()}
